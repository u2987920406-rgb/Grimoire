name: Publish Web Test

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "core/**"
      - "adventures/**"
      - "tests/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "grimoire-web"
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Godot Web
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          fi

      - name: Import project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Run Forgotten Valley E2E smoke test
        shell: bash
        run: godot --headless --path . --script tests/smoke/forgotten_valley_e2e.gd

      - name: Run Forgotten Valley navigation smoke test
        shell: bash
        run: godot --headless --path . --script tests/smoke/forgotten_valley_navigation.gd

      - name: Run Forgotten Valley 2D smoke test
        shell: bash
        run: godot --headless --path . --script tests/smoke/forgotten_valley_2d.gd

      - name: Export Web
        shell: bash
        run: |
          rm -rf /tmp/grimoire-web
          mkdir -p /tmp/grimoire-web
          godot --headless --verbose --path . --export-release "Web Test" "/tmp/grimoire-web/index.html"
          test -f /tmp/grimoire-web/index.html
          test -f /tmp/grimoire-web/index.wasm
          test -f /tmp/grimoire-web/index.pck
          printf '%s\n' "$GITHUB_SHA" > /tmp/grimoire-web/source-commit.txt
          touch /tmp/grimoire-web/.nojekyll

      - name: Publish web-build branch
        shell: bash
        run: |
          rm -rf /tmp/grimoire-web-git
          mkdir -p /tmp/grimoire-web-git
          cp -a /tmp/grimoire-web/. /tmp/grimoire-web-git/
          cd /tmp/grimoire-web-git
          git init
          git config user.name "grimoire-web-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git checkout -b web-build
          git add -A
          git commit -m "web: publish $GITHUB_SHA"
          git push --force origin web-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
