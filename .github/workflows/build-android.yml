name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile_build.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mobile build number
        id: build
        shell: bash
        run: |
          BUILD_NUMBER="$(tr -d '\\r\\n ' < mobile_build.txt)"
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building Grimoire mobile build $BUILD_NUMBER"

      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        with:
          path: /root/.grimoire-signing/debug.keystore
          key: grimoire-android-debug-keystore-v1

      - name: Prepare stable debug signing key
        shell: bash
        run: |
          mkdir -p /root/.grimoire-signing
          if [ ! -f /root/.grimoire-signing/debug.keystore ]; then
            keytool -genkeypair \
              -keystore /root/.grimoire-signing/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Grimoire,C=FR"
          fi
          cp /root/.grimoire-signing/debug.keystore /root/debug.keystore

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          fi

      - name: Import project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/grimoire-mobile-${{ steps.build.outputs.number }}.apk"

      - name: Install Android 16K diagnostic tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "ndk;28.0.12433566"

      - name: Diagnose APK
        shell: bash
        run: |
          set -e
          APK="build/android/grimoire-mobile-${{ steps.build.outputs.number }}.apk"
          echo "===== AAPT BADGING ====="
          /usr/lib/android-sdk/build-tools/35.0.0/aapt dump badging "$APK"
          echo "===== APK SIGNATURE ====="
          /usr/lib/android-sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          echo "===== ZIPALIGN 16K ====="
          /usr/lib/android-sdk/build-tools/35.0.0/zipalign -c -P 16 -v 4 "$APK"
          echo "===== ELF LOAD ALIGNMENT ====="
          rm -rf /tmp/grimoire-apk && mkdir -p /tmp/grimoire-apk
          unzip -q "$APK" -d /tmp/grimoire-apk
          OBJDUMP="/usr/lib/android-sdk/ndk/28.0.12433566/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          for SO in /tmp/grimoire-apk/lib/arm64-v8a/*.so; do
            echo "--- $SO"
            "$OBJDUMP" -p "$SO" | grep LOAD
            if "$OBJDUMP" -p "$SO" | grep LOAD | grep -Eq "align 2\\*\\*(1[0-3]|[0-9])$"; then
              echo "UNALIGNED_16K: $SO"
              exit 1
            fi
          done
          echo "ALL_ARM64_ELF_SEGMENTS_16K_ALIGNED"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-mobile-${{ steps.build.outputs.number }}
          path: build/android/grimoire-mobile-${{ steps.build.outputs.number }}.apk
          if-no-files-found: error
          retention-days: 14
