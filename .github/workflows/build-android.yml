name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile_build.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read mobile build number
        id: build
        shell: bash
        run: |
          BUILD_NUMBER="$(tr -d '\\r\\n ' < mobile_build.txt)"
          echo "number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building Grimoire mobile build $BUILD_NUMBER"

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          fi

      - name: Import project
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/grimoire-mobile-${{ steps.build.outputs.number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-mobile-${{ steps.build.outputs.number }}
          path: build/android/grimoire-mobile-${{ steps.build.outputs.number }}.apk
          if-no-files-found: error
          retention-days: 14
