<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#77bff4"/><stop offset="1" stop-color="#eaf3df"/></linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#73884f"/><stop offset="1" stop-color="#526643"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4aa0cf"/><stop offset=".5" stop-color="#7fcbd7"/><stop offset="1" stop-color="#3e91bc"/></linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfc18d"/><stop offset="1" stop-color="#b88c55"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<g opacity=".25" fill="#fff"><ellipse cx="250" cy="115" rx="105" ry="28"/><ellipse cx="930" cy="90" rx="130" ry="34"/></g>
<!-- distant cliffs -->
<path d="M0 310 L120 210 210 245 305 150 390 220 505 170 610 248 720 135 825 215 945 120 1060 205 1180 155 1280 225 1280 400 0 400Z" fill="#8da58c"/>
<path d="M0 335 L105 270 210 300 330 225 470 305 585 245 705 315 820 230 950 300 1060 250 1190 310 1280 280 1280 430 0 430Z" fill="url(#hill)"/>
<!-- ruins -->
<g fill="#b9b7aa" stroke="#8f907f" stroke-width="4">
 <rect x="845" y="85" width="38" height="120"/><rect x="895" y="65" width="46" height="140"/><rect x="950" y="95" width="35" height="110"/>
 <path d="M820 205 V130 H1010 V205 Z"/><circle cx="915" cy="145" r="35" fill="#80b9d7"/>
</g>
<!-- trees -->
<g fill="#355b2e"><circle cx="95" cy="300" r="80"/><circle cx="180" cy="270" r="65"/><circle cx="1110" cy="300" r="80"/><circle cx="1210" cy="275" r="70"/></g>
<!-- village houses -->
<g stroke="#6e4a2d" stroke-width="4">
 <g><rect x="90" y="300" width="235" height="210" rx="8" fill="#efe1bf"/><path d="M65 315 L205 220 350 315 Z" fill="#c9633d"/><rect x="150" y="360" width="50" height="75" fill="#7c5d42"/><rect x="230" y="350" width="48" height="48" fill="#7db2c2"/></g>
 <g><rect x="360" y="335" width="220" height="175" rx="8" fill="#f3e6c7"/><path d="M340 345 L470 260 600 345 Z" fill="#cf6940"/><rect x="435" y="375" width="50" height="65" fill="#78583e"/></g>
 <g><rect x="815" y="310" width="215" height="200" rx="8" fill="#ead7b2"/><path d="M790 325 L920 245 1055 325 Z" fill="#c55c3b"/><rect x="875" y="355" width="56" height="70" fill="#7f5b3c"/></g>
</g>
<!-- mill -->
<g transform="translate(715 405)">
 <circle cx="0" cy="0" r="82" fill="#6f4d2f" stroke="#3f2b1e" stroke-width="10"/>
 <circle cx="0" cy="0" r="18" fill="#c99a5d"/>
 <g stroke="#c99a5d" stroke-width="8"><line x1="-75" y1="0" x2="75" y2="0"/><line x1="0" y1="-75" x2="0" y2="75"/><line x1="-53" y1="-53" x2="53" y2="53"/><line x1="53" y1="-53" x2="-53" y2="53"/></g>
</g>
<!-- river -->
<path d="M555 470 C700 440 760 470 850 500 C980 545 1100 520 1280 555 L1280 720 555 720Z" fill="url(#water)"/>
<g fill="#eef9ef" opacity=".7"><path d="M590 520 Q720 490 820 530"/><path d="M760 590 Q940 550 1110 600"/></g>
<!-- bridge -->
<path d="M695 505 Q835 385 980 500 L980 545 Q835 440 695 550Z" fill="#b7aa91" stroke="#837866" stroke-width="6"/>
<path d="M740 510 Q835 445 930 515" fill="none" stroke="#6f6659" stroke-width="12"/>
<!-- foreground path -->
<path d="M0 720 L0 505 C170 480 330 500 505 545 C615 575 690 625 760 720Z" fill="url(#path)"/>
<path d="M30 650 C180 570 350 575 530 630" fill="none" stroke="#f0d7a1" stroke-width="12" opacity=".55"/>
<!-- flowers -->
<g fill="#f5d46a"><circle cx="60" cy="540" r="8"/><circle cx="105" cy="560" r="7"/><circle cx="305" cy="545" r="8"/><circle cx="1040" cy="525" r="8"/></g>
<g fill="#c85a7c"><circle cx="82" cy="570" r="7"/><circle cx="280" cy="520" r="7"/><circle cx="1080" cy="548" r="7"/></g>
<!-- sign -->
<g transform="translate(1120 370)" font-family="sans-serif" font-weight="700" font-size="20" fill="#2f241c">
 <rect x="0" y="0" width="125" height="38" rx="6" fill="#a8753e"/><text x="18" y="26">Moulin →</text>
 <rect x="-10" y="45" width="135" height="38" rx="6" fill="#a8753e"/><text x="10" y="71">Ruines ↑</text>
 <rect x="55" y="82" width="12" height="115" fill="#674524"/>
</g>
</svg>